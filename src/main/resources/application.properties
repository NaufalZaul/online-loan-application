spring.application.name=loan-app

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/loanapp_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Asia/Jakarta
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta


#redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

#User account configuration
loanapp.secretkey=${JWT_SECRET:sjdnaisdpadnaqniojfpaeijnaiejwiefhwe}
loanapp.expiration=${JWT_EXPIRATION:86400000}

